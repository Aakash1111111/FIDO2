## IDF Component Manager manifest (versions pinned for reproducibility;
## exact resolved versions are recorded in firmware/dependencies.lock).
dependencies:
  idf: ">=5.3,<5.4"
  espressif/esp_tinyusb: "==1.7.6~1"
  # esp_tinyusb 1.7.x is not forward-compatible with TinyUSB 0.19+
  espressif/tinyusb: ">=0.17.0,<0.19.0"
